<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projective Geometry Sequencer</title>
<style>
  :root {
    --bg: oklch(0.13 0.015 265);
    --panel: oklch(0.17 0.018 265);
    --line: oklch(0.25 0.025 265);
    --control-line: oklch(0.52 0.035 265);
    --ink: oklch(0.94 0.02 265);
    --dim: oklch(0.65 0.04 265);
    --accent: oklch(0.78 0.14 70);
    --focus: oklch(0.78 0.12 225);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, -apple-system, system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 292px; height: 100vh; overflow: hidden;
  }
  main { display: grid; grid-template-rows: minmax(0, 1fr) 300px 132px; gap: 1px; background: var(--line); min-width: 0; min-height: 0; overflow: hidden; }
  section { background: var(--panel); position: relative; min-height: 0; overflow: hidden; }
  section > h2 {
    position: absolute; top: 8px; left: 12px; margin: 0; z-index: 2;
    font: 500 10px/1 ui-monospace, monospace; letter-spacing: .13em;
    text-transform: uppercase; color: var(--dim); pointer-events: none;
  }
  /* canvases are absolutely positioned so they can never drive their own
     container's height — a canvas at height:100% inside an auto-height grid
     item feeds its intrinsic size back and blows the layout out */
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  #mid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 1px; background: var(--line); overflow: hidden; }
  #mid > div { background: var(--panel); position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #readout {
    position: absolute; inset: 0; padding: 30px 14px 12px; overflow: auto;
    font: 11px/1.7 ui-monospace, monospace; color: var(--dim); white-space: pre;
  }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; }
  aside h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .02em; }
  aside .sub { color: var(--dim); font-size: 11px; margin-bottom: 14px; }
  fieldset { border: 0; border-top: 1px solid var(--line); margin: 0 0 12px; padding: 10px 0 0; }
  legend { font: 500 9px/1 ui-monospace, monospace; letter-spacing: .13em; text-transform: uppercase; color: var(--dim); padding: 0 6px 0 0; }
  label { display: grid; grid-template-columns: 88px 1fr 44px; align-items: center; gap: 8px; margin: 7px 0; color: var(--dim); font-size: 11px; }
  label > span:last-child { text-align: right; color: var(--ink); font: 11px ui-monospace, monospace; }
  select, input[type=text] {
    grid-column: 2 / span 2; width: 100%; background: oklch(0.20 0.025 265); color: var(--ink);
    border: 1px solid var(--control-line); border-radius: 5px; padding: 4px 6px; font: 11px ui-monospace, monospace;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=range]:disabled { opacity: .38; cursor: not-allowed; }
  input[type=checkbox] { justify-self: start; accent-color: var(--accent); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  button {
    background: oklch(0.22 0.03 265); color: var(--ink); border: 1px solid var(--control-line);
    border-radius: 6px; padding: 7px 8px; font: 500 11px ui-sans-serif, sans-serif; cursor: pointer;
  }
  button:hover { border-color: oklch(0.62 0.05 265); }
  button:active { background: oklch(0.26 0.035 265); }
  button:disabled { color: var(--dim); cursor: not-allowed; opacity: .55; }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }
  button.primary { background: var(--accent); color: oklch(0.18 0.03 70); border-color: var(--accent); }
  .wide { grid-column: 1 / -1; }
  #status { margin-top: 10px; color: var(--dim); font: 10px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font: 10px ui-monospace, monospace; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .corridor-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .corridor-actions button[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent);
  }
  .corridor-axis {
    display: flex; justify-content: space-between; margin: -2px 44px 0 96px;
    color: var(--dim); font: 9px/1 ui-monospace, monospace;
  }
  #corridorState {
    min-height: 30px; margin: 8px 0; color: var(--dim);
    font: 10px/1.5 ui-monospace, monospace;
  }
  #corridorState[data-state="queued"] { color: var(--accent); }
  /* performance mode: one focal point, nothing else on screen */
  #perf { position: fixed; inset: 0; background: var(--bg); z-index: 20; cursor: ns-resize; }
  #perf[hidden] { display: none; }
  #perf canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<main>
  <section><h2>3D — form, eyes, rays</h2><canvas id="viewport"></canvas></section>
  <section id="mid">
    <div><h2>2D — circle</h2><canvas id="circle"></canvas></div>
    <div><h2>readout</h2><div id="readout"></div></div>
  </section>
  <section><h2>1D — grid / MIDI roll</h2><canvas id="grid"></canvas></section>
</main>

<aside>
  <h1>Projective Geometry Sequencer</h1>
  <div class="sub">3D form → 2D circle → 1D grid</div>

  <fieldset>
    <legend>Preset</legend>
    <label>Load <select id="preset"></select></label>
  </fieldset>

  <fieldset>
    <legend>Form</legend>
    <label>Solid <select id="solid"></select></label>
    <label>ωx <input type="range" id="wx" min="0" max="2" step="0.001"><span id="wx_v"></span></label>
    <label>ωy <input type="range" id="wy" min="0" max="2" step="0.001"><span id="wy_v"></span></label>
    <label>ωz <input type="range" id="wz" min="0" max="2" step="0.001"><span id="wz_v"></span></label>
    <label>Tempo sync <input type="checkbox" id="tempoSync"><span id="rateUnit"></span></label>
    <div class="btns">
      <button id="irrational" class="wide">Reset rates to 1 : √2 : φ</button>
      <button id="snapRational" class="wide">Snap rates to rational (closes)</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>Eyes</legend>
    <label>Count <select id="nEyes"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
    <label>Radius <input type="range" id="eyeRadius" min="1.15" max="8" step="0.01"><span id="eyeRadius_v"></span></label>
    <label>Orbit rate <input type="range" id="eyeRate" min="0" max="2" step="0.001"><span id="eyeRate_v"></span></label>
    <label>Plane tilt <input type="range" id="tilt" min="0" max="1.5708" step="0.001"><span id="tilt_v"></span></label>
    <label>Depth mode <select id="projMode">
      <option value="view">view-basis (well-conditioned)</option>
      <option value="worldz">spec-literal |Dz|</option>
    </select></label>
    <div class="legend" id="eyeLegend"></div>
  </fieldset>

  <fieldset>
    <legend>Grid</legend>
    <label>Resolution <select id="gridN">
      <option value="4">1/4</option><option value="8">1/8</option>
      <option value="16">1/16</option><option value="32">1/32</option>
    </select></label>
    <label>Loop <select id="bars">
      <option value="1">1 bar</option><option value="2">2 bars</option>
      <option value="4">4 bars</option><option value="8">8 bars</option>
      <option value="16">16 bars</option><option value="32">32 bars</option>
    </select></label>
    <label>Tempo <input type="range" id="bpm" min="40" max="220" step="1"><span id="bpm_v"></span></label>
    <label>Gate <input type="range" id="gate" min="0.05" max="1" step="0.01"><span id="gate_v"></span></label>
  </fieldset>

  <fieldset>
    <legend>Groove</legend>
    <label>Micro-timing <input type="range" id="timing" min="0" max="1" step="0.01"><span id="timing_v"></span></label>
    <label>Depth keep <input type="range" id="depthKeep" min="0.1" max="1" step="0.01"><span id="depthKeep_v"></span></label>
    <label>Radius gate <input type="range" id="radiusGate" min="0" max="0.9" step="0.01"><span id="radiusGate_v"></span></label>
    <label>Velocity <select id="velocitySource">
      <option value="radius">Projected radius</option>
      <option value="approach">Approach speed</option>
      <option value="magnification">Lens magnification</option>
      <option value="angle">Angle (spec)</option>
    </select></label>
    <div class="btns"><button id="specLiteral" class="wide">Revert to spec-literal</button></div>
  </fieldset>

  <fieldset>
    <legend>Gravity</legend>
    <label>Eccentricity <input type="range" id="ecc" min="0" max="0.85" step="0.005"><span id="ecc_v"></span></label>
    <label>Lens radius <input type="range" id="lensRadius" min="0" max="1.5" step="0.005"><span id="lensRadius_v"></span></label>
    <label>Eye rates <select id="eyeRates">
      <option value="phi">φ ratios (spec)</option>
      <option value="kepler">Kepler 3rd law</option>
      <option value="rational">Rational (can close)</option>
    </select></label>
  </fieldset>

  <fieldset>
    <legend>Quasilattice</legend>
    <label>Enable <input type="checkbox" id="lattice" checked><span></span></label>
    <label>Slope α <select id="alphaPreset"></select></label>
    <label>Density <input type="range" id="density" min="0.05" max="1" step="0.01"><span id="density_v"></span></label>
    <label>Phason <input type="range" id="rho" min="0" max="1" step="0.005"><span id="rho_v"></span></label>
    <label>Drift <input type="range" id="phasonRate" min="0" max="0.2" step="0.001"><span id="phasonRate_v"></span></label>
    <label>Eye spread <input type="range" id="eyeSpread" min="0" max="1" step="0.01"><span id="eyeSpread_v"></span></label>
  </fieldset>

  <fieldset>
    <legend>Pitch</legend>
    <label>Scale <select id="scale">
      <option value="native">Native (solid's own ratio)</option>
      <option value="pentatonic">Pentatonic</option>
      <option value="wholetone">Whole tone</option>
      <option value="chromatic">Chromatic</option>
      <option value="custom">Custom</option>
      <option value="drum">Drum map (GM percussion)</option>
    </select></label>
    <label>Custom <input type="text" id="customDegrees" placeholder="0,3,5,7,10"></label>
    <label>Drum map <input type="text" id="drumMap" placeholder="36,38,42,46,…"></label>
    <label>Base note <input type="range" id="baseNote" min="24" max="84" step="1"><span id="baseNote_v"></span></label>
    <label>Octaves <input type="range" id="octaveSpan" min="1" max="5" step="1"><span id="octaveSpan_v"></span></label>
    <label>Transpose <input type="text" id="eyeTranspose" placeholder="0,12,24,0"></label>
    <label>Vel min <input type="range" id="velMin" min="1" max="127" step="1"><span id="velMin_v"></span></label>
    <label>Vel max <input type="range" id="velMax" min="1" max="127" step="1"><span id="velMax_v"></span></label>
    <label>Show pitch <input type="checkbox" id="showPitch" checked><span></span></label>
  </fieldset>

  <fieldset id="corridorPanel">
    <legend>Safe corridor</legend>
    <div class="corridor-actions" role="group" aria-label="Capture corridor endpoints">
      <button id="corridorA" type="button" aria-pressed="true">Capture A</button>
      <button id="corridorB" type="button" aria-pressed="false">Capture B</button>
    </div>
    <label>Morph <input type="range" id="corridorMorph" min="0" max="1" step="0.002" disabled aria-describedby="corridorState"><span id="corridorMorph_v">set B</span></label>
    <div class="corridor-axis" aria-hidden="true"><span>A</span><span>topology</span><span>B</span></div>
    <div id="corridorState" role="status" aria-live="polite" data-state="setup">A is safe. Shape another patch, then capture B.</div>
    <div class="btns"><button id="corridorHome" type="button" class="wide">Return to A <span aria-hidden="true">H</span></button></div>
  </fieldset>

  <fieldset>
    <legend>Macros</legend>
    <label>Space <input type="range" id="mSpace" min="0" max="1" step="0.002"><span id="mSpace_v"></span></label>
    <label>Energy <input type="range" id="mEnergy" min="0" max="1" step="0.002"><span id="mEnergy_v"></span></label>
    <div class="btns">
      <button id="capture">Capture base</button>
      <button id="lockToggle">Lock: off</button>
      <button id="learnSpace">Learn Space CC</button>
      <button id="learnEnergy">Learn Energy CC</button>
      <button id="perfMode" class="wide primary">Performance mode</button>
    </div>
    <label style="margin-top:8px">Endless enc. <input type="checkbox" id="relativeCC"><span></span></label>
  </fieldset>

  <fieldset>
    <legend>Output</legend>
    <label>MIDI port <select id="midiPort"><option>— not connected —</option></select></label>
    <label>Clock <select id="clockSource">
      <option value="internal">Internal</option>
      <option value="external">External — follow DAW</option>
    </select></label>
    <label>Preview synth <input type="checkbox" id="preview" checked><span></span></label>
    <label>Export passes <select id="passes">
      <option value="1">1× loop</option><option value="2">2×</option>
      <option value="4">4×</option><option value="8">8×</option><option value="16">16×</option>
    </select></label>
    <div class="btns">
      <button id="play" class="primary">Play</button>
      <button id="reset">Reset</button>
      <button id="connect" class="wide">Connect Web MIDI</button>
      <button id="export" class="wide">Export .mid</button>
    </div>
    <div id="status"></div>
  </fieldset>
</aside>

<div id="perf" hidden><canvas id="perfCanvas"></canvas></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
